[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pressume"
version = "0.2.0"
description = "Render and verify resume PDFs from Markdown with Pandoc and Typst."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Seth A. Strawbridge" }]
keywords = ["resume", "cv", "markdown", "typst", "pandoc", "ats", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    # cryptography 49 removed macOS x86_64 wheels. pdfminer uses it indirectly,
    # so keep the final Intel-compatible release on Intel Macs and a patched
    # release everywhere else.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=50; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pdfminer.six>=20231228",
    "pypandoc-binary>=1.13",
    "typst>=0.14.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/sethstraw/pressume"
Repository = "https://github.com/sethstraw/pressume"
Issues = "https://github.com/sethstraw/pressume/issues"
Changelog = "https://github.com/sethstraw/pressume/blob/main/CHANGELOG.md"

# PEP 735. Development dependencies are not an installable extra of this
# package, and declaring them as one was always a workaround for the absence of
# this table.
[dependency-groups]
dev = [
    "build>=1.2",
    "check-wheel-contents>=0.6",
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "reportlab>=4.0",
    "ruff>=0.5",
]

[project.scripts]
pressume = "pressume.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pressume"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github",
    "/docs",
    "/src",
    "/tests",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "SIM", "PIE", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src"]

# Serena uses Pyright for semantic Python diagnostics. Keep it on the local
# project environment and source-layout import root.
[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "build", "dist", "**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
extraPaths = ["src"]

[tool.coverage.run]
branch = true
source = ["pressume"]
omit = ["src/pressume/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratcheted as coverage grows; never lowered to make a run pass.
fail_under = 88
