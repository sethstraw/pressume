[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pressume"
version = "0.1.0"
description = "Render polished, ATS-readable resume PDFs from Markdown, via Pandoc and Typst."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Seth A. Strawbridge" }]
keywords = ["resume", "cv", "markdown", "typst", "pandoc", "ats", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "pdfminer.six>=20231228",
    "pypandoc-binary>=1.13",
    "typst>=0.14.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/sethstraw/pressume"
Repository = "https://github.com/sethstraw/pressume"
Issues = "https://github.com/sethstraw/pressume/issues"
Changelog = "https://github.com/sethstraw/pressume/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "check-wheel-contents>=0.6",
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "reportlab>=4.0",
    "ruff>=0.5",
    "twine>=6.0",
]

[project.scripts]
pressume = "pressume.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pressume"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github",
    "/docs",
    "/src",
    "/tests",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "SIM", "PIE", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["pressume"]
omit = ["src/pressume/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratcheted as coverage grows; never lowered to make a run pass.
fail_under = 88
