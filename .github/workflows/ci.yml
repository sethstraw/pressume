name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Refuse to install a package matching a known malware advisory, before any
  # of its code is allowed to run.
  UV_MALWARE_CHECK: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
          cache: pip
      - name: Install uv
        # astral-sh/setup-uv v5.1.0
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a
        with:
          enable-cache: true
      - name: Install exactly what the lockfile says
        # --locked fails if the lockfile and pyproject.toml have drifted, rather
        # than quietly resolving something nobody reviewed. --frozen would skip
        # that comparison, which is how a stale lockfile survives unnoticed.
        run: uv sync --locked --all-groups
      - name: Audit dependencies for known vulnerabilities
        run: uv audit --preview-features audit-command
      # The same script a person runs, so a local pass and a green build mean the
      # same thing. The advisory audit above needs the runner's resolved
      # environment, so it stays outside.
      - name: Verification gate
        run: bash scripts/gate.sh

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # The development tools are a PEP 735 dependency group, not an extra.
        # pip reads groups from 25.1 onward, and the runner images ship an
        # older pip on the oldest interpreters in this matrix.
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip>=25.1"
          python -m pip install --disable-pip-version-check -e . --group dev
      - name: Test
        run: pytest -q

  package:
    name: Build and smoke-test distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
          cache: pip
      # pressume is installed from this repository, not from a package index,
      # so what this job proves is that `pip install git+...` gives a working
      # tool with its fonts and templates inside the wheel.
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build check-wheel-contents
      - name: Build
        run: python -m build
      - name: Validate wheel contents
        run: check-wheel-contents dist/*.whl
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Exercise documented quick start
        run: |
          mkdir smoke
          cd smoke
          pressume new resume
          pressume render
          pressume check --json

  workflows:
    name: Audit the workflows themselves
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install uv
        # astral-sh/setup-uv v5.1.0
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a
      - name: Lint the workflows
        # A workflow is code with credentials attached, so it gets linted too.
        run: uvx zizmor --persona=regular .github/workflows
