name: Bug report
description: Report reproducible behavior that differs from pressume's contract.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach a real resume or personal contact information. Use synthetic content.
  - type: input
    id: version
    attributes:
      label: pressume version
      description: Output from `pressume --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system name and Python version from `pressume doctor`.
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      description: For example macOS 15.4, Windows 11 24H2, or Ubuntu 24.04. `pressume doctor` prints the kernel release, not the product version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and synthetic Markdown or TOML needed to reproduce the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real names, contact details, credentials, and resume content.
          required: true
